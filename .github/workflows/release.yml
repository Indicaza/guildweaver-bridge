name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine release metadata
        id: meta
        shell: pwsh
        run: |
          $bridgeVersion = node -p "require('./package.json').version"
          $shortSha = $env:GITHUB_SHA.Substring(0, 8)

          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseTag = $env:GITHUB_REF_NAME
            $releaseVersion = $env:GITHUB_REF_NAME.TrimStart('v')
            $title = "Guildweaver Bridge $releaseVersion"
            if ($releaseVersion -match '-(alpha|beta|rc)') {
              $channel = 'beta'
              $prerelease = 'true'
            } else {
              $channel = 'stable'
              $prerelease = 'false'
            }
          } else {
            $channel = 'edge'
            $releaseTag = 'edge'
            $releaseVersion = "$bridgeVersion+edge.$shortSha"
            $prerelease = 'true'
            $title = "Guildweaver Bridge edge $shortSha"
          }

          "bridge_version=$bridgeVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package Windows bridge
        shell: pwsh
        env:
          BRIDGE_VERSION: ${{ steps.meta.outputs.bridge_version }}
          RELEASE_VERSION: ${{ steps.meta.outputs.release_version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          $root = Join-Path $PWD 'dist/GuildweaverBridge'
          $app = Join-Path $root 'app'
          New-Item -ItemType Directory -Path $app -Force | Out-Null

          Copy-Item (Get-Command node).Source (Join-Path $root 'node.exe')
          Copy-Item src (Join-Path $app 'src') -Recurse
          Copy-Item package.json (Join-Path $app 'package.json')

          $release = [ordered]@{
            schemaVersion = 1
            bridgeVersion = $env:BRIDGE_VERSION
            releaseVersion = $env:RELEASE_VERSION
            channel = $env:CHANNEL
            commit = $env:GITHUB_SHA
            bridgeProtocol = 2
          }
          $release | ConvertTo-Json | Set-Content (Join-Path $app 'release.json') -Encoding utf8

          @"
          @echo off
          "%~dp0node.exe" "%~dp0app\src\cli.js" install-package
          if errorlevel 1 pause
          "@.Trim() | Set-Content (Join-Path $root 'Install Guildweaver Bridge.cmd') -Encoding ascii

          & (Join-Path $root 'node.exe') (Join-Path $app 'src/cli.js') help

          Compress-Archive -Path $root -DestinationPath 'dist/GuildweaverBridge.zip' -CompressionLevel Optimal
          $hash = (Get-FileHash 'dist/GuildweaverBridge.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $hash | Set-Content 'dist/GuildweaverBridge.zip.sha256' -Encoding ascii

          $manifest = [ordered]@{
            schemaVersion = 1
            bridgeVersion = $env:BRIDGE_VERSION
            releaseVersion = $env:RELEASE_VERSION
            channel = $env:CHANNEL
            commit = $env:GITHUB_SHA
            bridgeProtocol = 2
            artifact = 'GuildweaverBridge.zip'
            checksum = 'GuildweaverBridge.zip.sha256'
          }
          $manifest | ConvertTo-Json | Set-Content 'dist/release.json' -Encoding utf8

          if (-not (Test-Path 'dist/GuildweaverBridge.zip')) { throw 'Bridge archive was not created' }
          if (-not (Test-Path 'dist/GuildweaverBridge.zip.sha256')) { throw 'Bridge checksum was not created' }
          if (-not (Test-Path 'dist/release.json')) { throw 'Bridge manifest was not created' }

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: guildweaver-bridge-windows
          path: |
            dist/GuildweaverBridge.zip
            dist/GuildweaverBridge.zip.sha256
            dist/release.json
          retention-days: 7

      - name: Replace edge release
        if: github.event_name == 'push' && steps.meta.outputs.channel == 'edge'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete edge --cleanup-tag --yes 2>$null
          gh release create edge dist/GuildweaverBridge.zip dist/GuildweaverBridge.zip.sha256 dist/release.json --target $env:GITHUB_SHA --title "${{ steps.meta.outputs.title }}" --notes "Automated edge build from $env:GITHUB_SHA." --prerelease

      - name: Publish tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $args = @(
            '${{ steps.meta.outputs.release_tag }}',
            'dist/GuildweaverBridge.zip',
            'dist/GuildweaverBridge.zip.sha256',
            'dist/release.json',
            '--title', '${{ steps.meta.outputs.title }}',
            '--generate-notes'
          )
          if ('${{ steps.meta.outputs.prerelease }}' -eq 'true') { $args += '--prerelease' }
          gh release create @args

      - name: Replace beta or stable channel release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $channel = '${{ steps.meta.outputs.channel }}'
          gh release delete $channel --cleanup-tag --yes 2>$null
          $args = @(
            $channel,
            'dist/GuildweaverBridge.zip',
            'dist/GuildweaverBridge.zip.sha256',
            'dist/release.json',
            '--target', $env:GITHUB_SHA,
            '--title', "Guildweaver Bridge $channel — ${{ steps.meta.outputs.release_version }}",
            '--notes', "Channel pointer for ${{ steps.meta.outputs.release_tag }}."
          )
          if ('${{ steps.meta.outputs.prerelease }}' -eq 'true') { $args += '--prerelease' }
          gh release create @args
